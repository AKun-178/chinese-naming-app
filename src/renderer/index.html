<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>视频姓名批量替换</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="app">
      <section class="workspace">
        <header class="masthead">
          <div>
            <p class="kicker">桌面版</p>
            <h1>视频姓名批量替换</h1>
          </div>
          <div class="status" id="status">待开始</div>
        </header>

        <form id="renderForm" class="grid">
          <section class="panel span-2">
            <div class="panel-title">
              <h2>文件</h2>
              <span>视频和导出目录都在本机</span>
            </div>
            <div class="pickers">
              <button type="button" class="pick" id="pickVideo">选择模板视频</button>
              <strong id="videoName">尚未选择</strong>
              <button type="button" class="pick" id="pickOutput">选择导出文件夹</button>
              <strong id="outputName">尚未选择</strong>
            </div>
          </section>

          <section class="panel">
            <div class="panel-title">
              <h2>客户信息</h2>
              <span>一行一个：姓名，生日，日期，道长</span>
            </div>
            <textarea id="names" rows="12" placeholder="王杰，1998年7月21日，2026年5月12号，天一&#10;李四，19970525，2026年5月12号，天一道长" required></textarea>
          </section>

          <section class="panel">
            <div class="panel-title">
              <h2>黄纸区域</h2>
              <span>日期、姓名、生日所在的位置</span>
            </div>
            <div class="fields four">
              <label>X<input id="x" type="number" value="184" min="0" /></label>
              <label>Y<input id="y" type="number" value="490" min="0" /></label>
              <label>宽<input id="width" type="number" value="135" min="8" /></label>
              <label>高<input id="height" type="number" value="130" min="8" /></label>
            </div>
            <div class="fields two">
              <label>完整视频出现秒<input id="start" type="number" value="0" min="0" step="0.01" /></label>
              <label>完整视频结束秒<input id="end" type="number" value="65" min="0" step="0.01" /></label>
            </div>
            <label>视频质量（数字越小越清晰）<input id="crf" type="number" value="15" min="10" max="35" /></label>
            <input id="fontSize" type="hidden" value="16" />
            <input id="fontFamily" type="hidden" value="hand" />
            <textarea id="visualTextTemplate" hidden>{date}&#10;{name}&#10;{birthdayDigits}</textarea>
            <input id="fontColor" type="hidden" value="#23160a" />
            <input id="boxAlpha" type="hidden" value="0" />
            <input id="boxColor" type="hidden" value="#edbd0e" />
            <input id="align" type="hidden" value="center" />
            <button type="button" class="save" id="paperPreset">恢复黄纸位置预设</button>
          </section>

          <section class="panel span-2">
            <div class="panel-title">
              <h2>音频替换</h2>
              <span>结束秒填 0 时按生成语音长度替换</span>
            </div>
            <div class="fields two">
              <label>替换开始秒<input id="audioStart" type="number" value="0" min="0" step="0.01" /></label>
              <label>替换结束秒<input id="audioEnd" type="number" value="0" min="0" step="0.01" /></label>
            </div>
            <button type="button" class="pick" id="pickAudio">选择同名音频</button>
            <strong id="audioName">不选则使用 Fish Audio 或只替换画面</strong>
            <button type="button" class="pick" id="pickBackgroundAudio">更换背景音乐</button>
            <strong id="backgroundAudioName">已内置默认纯背景声</strong>
          </section>

          <section class="panel span-2">
            <div class="panel-title">
              <h2>Fish Audio</h2>
              <span>用户填写自己的 API</span>
            </div>
            <label class="toggle">
              <input id="fishEnabled" type="checkbox" />
              <span>没有同名音频时，自动调用 Fish Audio 生成</span>
            </label>
            <div class="fields two">
              <label>API Key<input id="fishApiKey" type="password" autocomplete="off" /></label>
              <label>音色 reference_id<input id="fishReferenceId" type="text" /></label>
            </div>
            <div class="fields two">
              <label>音色名称<input id="fishVoiceTitle" type="text" placeholder="例如：弘一道长" /></label>
              <div class="action-field">
                <button type="button" class="save" id="cloneFishVoice">上传音频并克隆音色</button>
                <strong id="fishCloneStatus">选择 10 秒以上清晰人声，成功后自动填入音色 ID</strong>
              </div>
            </div>
            <div class="fields two">
              <label>模型
                <select id="fishModel">
                  <option value="s2-pro">s2-pro</option>
                  <option value="s1">s1</option>
                </select>
              </label>
              <label>语速<input id="fishSpeed" type="number" value="1" min="0.5" max="2" step="0.05" /></label>
            </div>
            <label>生成句子模板
              <textarea id="fishTextTemplate" rows="3">{name}缘主你好，我是{masterName}道长，你的生日是{birthdayText}，很高兴在这里与你结缘相遇，接下来由我为你详细解析。</textarea>
            </label>
            <div class="button-row">
              <button type="button" class="save" id="saveSettings">保存 Fish 设置</button>
              <button type="button" class="save" id="openFishApi">获取 Fish API</button>
            </div>
          </section>

          <section class="panel span-2">
            <div class="panel-title">
              <h2>固定后段</h2>
              <span>可直接拼接，或生成一次后复用</span>
            </div>
            <label class="toggle">
              <input id="tailEnabled" type="checkbox" />
              <span>生成完整视频时拼接固定后段</span>
            </label>
            <label>后段处理方式
              <select id="tailMode">
                <option value="direct">不生成，直接拼接已做好的后段视频</option>
                <option value="build">生成一次后段音色并复用</option>
              </select>
            </label>
            <div class="pickers">
              <button type="button" class="pick" id="pickTailVideo">选择后段画面视频</button>
              <strong id="tailVideoName">尚未选择</strong>
              <button type="button" class="pick tail-build-only" id="pickTailBackground">选择后段纯背景音/视频</button>
              <strong class="tail-build-only" id="tailBackgroundName">尚未选择</strong>
            </div>
            <label class="tail-build-only">后段固定文案
              <textarea id="tailTextTemplate" rows="4" placeholder="这里填写后半段固定内容，不要填客户姓名、生日、日期。"></textarea>
            </label>
            <div class="button-row single tail-build-only">
              <button type="button" class="save" id="buildTailVideo">生成/更新固定后段</button>
            </div>
            <strong class="inline-status" id="tailBuildStatus">还没有生成固定后段</strong>
          </section>

          <section class="panel span-2">
            <div class="panel-title">
              <h2>图片 API</h2>
              <span>自动模仿原图手写并替换三行字</span>
            </div>
            <input id="aliyunEnabled" type="checkbox" checked hidden />
            <div class="fields two">
              <label>百炼 API Key<input id="aliyunApiKey" type="password" autocomplete="off" /></label>
              <label>地域
                <select id="aliyunRegion">
                  <option value="beijing">北京</option>
                  <option value="intl">新加坡</option>
                </select>
              </label>
            </div>
            <label>模型
              <select id="aliyunModel">
                <option value="qwen-image-2.0">qwen-image-2.0</option>
                <option value="qwen-image-2.0-pro">qwen-image-2.0-pro</option>
                <option value="qwen-image-edit-plus">qwen-image-edit-plus</option>
              </select>
            </label>
            <div class="button-row">
              <button type="button" class="save" id="saveAiSettings">保存 AI 设置</button>
              <button type="button" class="save" id="openAliyunApi">获取百炼 API</button>
            </div>
          </section>

          <div class="run-row span-2">
            <button class="run" type="submit">开始批量生成</button>
            <button class="danger" type="button" id="cancelRender" disabled>中断生成</button>
          </div>
        </form>
      </section>

      <aside class="results">
        <div class="panel-title">
          <h2>进度</h2>
          <span id="progressText">等待任务</span>
        </div>
        <progress id="progress" value="0" max="1"></progress>
        <div id="warnings" class="warnings"></div>
        <div id="outputs" class="output-list">
          <p class="empty">完成后会显示导出位置。</p>
        </div>
      </aside>
    </main>

    <canvas id="textCanvas" hidden></canvas>
    <div class="toast" id="toast" hidden></div>
    <script src="./app.js"></script>
  </body>
</html>
